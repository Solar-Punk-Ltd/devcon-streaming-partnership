<svg width="960" height="560" viewBox="0 0 960 560" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title>Streaming pipeline on Swarm</title>
<desc>A production block owned by the AV vendor (OBS, or cameras plus an encoder) captures and encodes, then hands off over SRT or RTMP into the media engine (SRS or OME: ingest, transcode, package), then the Swarm uploader. Swarm provides origin, storage, delivery and archive, replacing the origin server and CDN. Playback in the browser via custom hls.js and the bee client.</desc>
<defs>
  <marker id="elb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#C0C5C8"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="560" rx="10" fill="#F7F7F4" stroke="#ECECE9"/>

<text x="48" y="64" font-size="32" font-weight="700" fill="#22313F">Streaming pipeline on Swarm</text>
<text x="48" y="94" font-size="14.5" font-style="italic" fill="#97A1AA">Standard streaming stages. Swarm replaces the origin server and the CDN.</text>

