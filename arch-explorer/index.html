<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devcon 8 streaming architecture</title>
<meta name="description" content="Interactive explorer for the Devcon 8 streaming architecture: one canvas you open in place, a guided walkthrough, and how many of each thing runs.">
<link rel="stylesheet" href="src/render/tokens.css">
<link rel="stylesheet" href="src/render/app.css">
<link rel="stylesheet" href="src/render/scene.css">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Views"></nav>

  <header id="topbar">
    <button id="tree-toggle" class="tool" type="button" aria-pressed="true" title="Model tree, T" aria-label="Model tree">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 4h10M6 8h7M6 12h7M3 4v8"/>
      </svg>
    </button>
    <nav id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="bar-tail">
      <button id="scenario-open" class="tool" type="button" title="Take the walkthrough">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M4.6 3.2 12.6 8l-8 4.8z"/>
        </svg>
        <span>Walkthrough</span>
      </button>
      <button id="search-open" class="tool" type="button" title="Search">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="7.2" cy="7.2" r="4.4"/><path d="M10.5 10.5 13.8 13.8"/>
        </svg>
        <kbd>K</kbd>
      </button>
    </div>
  </header>

  <aside id="tree" aria-label="Model tree"></aside>

  <main id="stage" aria-label="Architecture canvas">
    <div id="overlays"></div>
    <section id="scenario" hidden aria-label="Scenario playback"></section>
  </main>

  <aside id="inspector" aria-label="Details"></aside>
</div>

<div id="palette" class="modal" hidden role="dialog" aria-modal="true" aria-label="Search"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
